# Camera translation/orientation must match the calibrated physical mount.
monocular_depth_cpp:
  ros__parameters:
    image_topic: /camera/image_rect_color
    cloud_topic: /perception/obstacles_camera
    diagnostics_topic: /perception/monocular_depth/diagnostics
    max_image_age_s: 0.25
    max_inference_ms: 100.0
    max_processing_ms: 100.0
    point_stride: 8
    opencv_threads: 1
    camera_info_topic: /camera/camera_info
    backend: auto  # .onnx -> CPU; .plan/.engine -> TensorRT
    model_path: /models/depth_fp16.plan
    use_sim_time: true
octomap_route_replanner:
  ros__parameters:
    use_sim_time: true
    planning_frame: map
    prior_map_file: /maps/prior.bt
    odometry_topic: /localization/odometry
    goal_topic: /goal_pose
    map_min:
    - -30.0
    - -30.0
    - 0.0
    map_max:
    - 30.0
    - 30.0
    - 15.0
    replan_rate_hz: 5.0
    clearance_m: 1.0
    max_cloud_age_s: 0.5
    max_expansions: 250000
local_navigation:
  ros__parameters:
    # Must match the immutable A* prior, ROI and clearance above.
    safety.prior_map_enabled: true
    safety.braking_acceleration_m_s2: 0.4
    prior_map_file: /maps/prior.bt
    map_min: [-30.0, -30.0, 0.0]
    map_max: [30.0, 30.0, 15.0]
    clearance_m: 1.0
    use_sim_time: true
    planning_frame: map
    body_frame: base_link
    control_rate_hz: 10.0
    state_timeout_s: 0.5
    obstacle_timeout_s: 0.5
    max_obstacle_source_age_s: 0.5
    max_compute_time_ms: 80.0
    goal_tolerance_m: 0.5
    goal_speed_tolerance_m_s: 0.5
    obstacle_max_points: 800
    min_obstacle_points: 12
    odometry_topic: /localization/odometry
    global_path_topic: /planning/global_path
    obstacles_topic: /perception/obstacles_camera
    raw_command_topic: /control/raw_velocity_command
    predicted_path_topic: /planning/mppi/predicted_path
    cost_samples_topic: /planning/mppi/cost_samples
    diagnostics_topic: /diagnostics
    mppi.dt_s: 0.1
    mppi.horizon_steps: 30
    mppi.samples: 80
    mppi.lambda: 1.0
    mppi.seed: 7
    mppi.cost_profile: project
    mppi.path_progress_objective: true
    mppi.max_speed_xy_m_s: 0.5
    mppi.max_speed_z_m_s: 0.6
    mppi.max_yaw_rate_rad_s: 0.6
    mppi.max_accel_xy_m_s2: 3.0
    mppi.max_accel_z_m_s2: 0.4
    mppi.max_yaw_accel_rad_s2: 0.6
    mppi.noise_xy: 0.8
    mppi.noise_z: 0.3
    mppi.noise_yaw: 0.3
    mppi.proactive_proposals: true
    mppi.blocked_route_detour_enabled: false
    mppi.blocked_route_path_scale: 0.0
    mppi.goal_weight: 0.0
    mppi.terminal_weight: 0.0
    mppi.obstacle_weight: 300.0
    mppi.obstacle_margin_m: 1.5
    mppi.collision_weight: 1000000.0
    mppi.collision_cost_buffer_m: 0.0
    mppi.effort_weight: 0.05
    mppi.smoothness_weight: 0.2
    mppi.yaw_weight: 0.2
    mppi.path_weight: 400.0
    mppi.path_scale_m: 1.0
    mppi.progress_weight: 5000.0
    mppi.speed_limit_weight: 10000.0
    mppi.stopping_weight: 0.0
    mppi.stopping_margin_m: 1.5
    response.enabled: true
    response.tau_s: 0.5
    # Initial response constant; requires identification before flight validation.
    response.yaw_enabled: true
    response.yaw_tau_s: 0.5
    response.accel_xy_m_s2: 3.0
    response.jerk_xy_m_s3: 4.0
    safety.collision_radius_m: 1.5
    safety.stopping_clearance_m: 1.5
    safety.stopping_delay_s: 0.25
    safety.stopping_uncertainty_m: 0.0
    safety.route_block_hold_enabled: false
    safety.route_block_lookahead_m: 3.0
    conditioner.alpha: 0.3
    stabilization.speed_shaping.nominal_speed_m_s: 0.5
    stabilization.speed_shaping.turn_speed_m_s: 0.5
    stabilization.speed_shaping.min_speed_m_s: 0.5
    visualization.enabled: false
    visualization.publish_rate_hz: 5.0
    visualization.max_mppi_samples: 80
    output_command_topic: /control/safe_velocity_command
odometry_tf:
  ros__parameters:
    use_sim_time: true
    # app.launch.py selects gazebo (ideal state) or explicitly mavros (real FCU).
    # Gazebo odom and map must have identical world ENU origin/axes.
    planning_frame: map
    body_frame: base_link
    odometry_topic: /localization/odometry
    max_state_age_s: 0.5
    camera_frame: camera_optical_frame
    camera_translation_m:
    - 0.0
    - 0.0
    - 0.0
    camera_quaternion_xyzw:
    - -0.5
    - 0.5
    - -0.5
    - 0.5
autopilot_adapter:
  ros__parameters:
    use_sim_time: true
    input_frame: map
    required_mode: GUIDED
    command_timeout_s: 0.25
    heartbeat_timeout_s: 2.0
    setpoint_rate_hz: 10.0
    max_speed_xy_m_s: 0.5
    max_speed_z_m_s: 0.6
    max_yaw_rate_rad_s: 0.6
    arm_on_start: false
    input_topic: /control/safe_velocity_command
    mavros_setpoint_topic: /mavros/setpoint_velocity/cmd_vel
    mavros_state_topic: /mavros/state
    diagnostics_topic: /diagnostics
